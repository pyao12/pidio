{% extends "base.html" %}
{% block page_header %}
    <h1>编辑子域名</h1>
{% endblock %}
{% block content %}
    <form method="post">
        {% csrf_token %}
        <table>
            <tr>
                <th>子域名</th>
                <td>{{ subdomain.subdomain_name }}</td>
            </tr>
            <tr>
                <th>基础域名</th>
                <td>{{ subdomain.base_domain }}</td>
            </tr>
            {{ form.as_p }}
        </table>
        <button type="submit">保存</button>
    </form>
    <a href="{% url 'index' %}">返回列表</a>
{% endblock %}
