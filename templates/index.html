{% extends "base.html" %}
{% block page_header %}
    <h1>子域名列表</h1>
{% endblock %}
{% block content %}
    <p><a href="{% url 'create_subdomain' %}">创建新子域名</a></p>
    <table>
        <thead>
            <tr>
                <th>子域名</th>
                <th>记录类型</th>
                <th>记录值</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for subdomain in subdomains %}
            <tr>
                <td>{{ subdomain }}</td>
                <td>{{ subdomain.record_type }}</td>
                <td>{{ subdomain.record_value }}</td>
                <td>
                    <a href="{% url 'edit_subdomain' subdomain.id %}">编辑</a>
                    <a href="{% url 'delete_subdomain' subdomain.id %}">删除</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
